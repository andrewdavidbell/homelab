apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ingress
  namespace: metallb-system
spec:
  addresses:
    - 10.5.50.60/32
  autoAssign: false        # only a Service that asks for .60 gets it
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: services
  namespace: metallb-system
spec:
  addresses:
    - 10.5.50.61-10.5.50.99
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: cluster-vlan
  namespace: metallb-system
spec:
  ipAddressPools:
    - ingress
    - services
