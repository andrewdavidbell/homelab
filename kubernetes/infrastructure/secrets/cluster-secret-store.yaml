apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  refreshInterval: 3600   # revalidate the store hourly (seconds), not every few minutes
  provider:
    onepasswordSDK:
      vault: Homelab-k8s
      auth:
        serviceAccountSecretRef:
          name: onepassword-sa-token
          namespace: flux-system
          key: token
      cache:              # experimental; trims repeat reads
        ttl: 30m
        maxSize: 100
