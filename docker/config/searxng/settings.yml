use_default_settings: true

general:
  instance_name: "homelab search"
  debug: false

server:
  bind_address: "0.0.0.0:8080"
  secret_key: ""  # set via SEARXNG_SECRET_KEY env var

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

ui:
  default_theme: simple

outgoing:
  request_timeout: 3.0

engines:
  - name: google
    engine: google
    shortcut: g

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: bing
    engine: bing
    shortcut: b

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    base_url: "https://en.wikipedia.org/"

doi_resolvers:
  oadoi.org: 'https://oadoi.org/'
  doi.org: 'https://doi.org/'

default_doi_resolver: 'oadoi.org'
